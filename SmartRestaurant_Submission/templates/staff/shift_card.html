{% load ui_vi %}<article class="staff-shift"><span class="staff-timeline-dot"></span><div><strong>{{ s.shift }}</strong><p>{{ s.start_at|date:'H:i' }} – {{ s.end_at|date:'H:i' }}</p><small>Vào: {{ s.attendance.check_in_time|date:'H:i'|default:'Chưa chấm' }} · Ra: {{ s.attendance.check_out_time|date:'H:i'|default:'Chưa chấm' }}</small></div><div class="staff-shift-status"><span class="staff-badge {{ s.status|lower }}">{{ s.status|ui_vi }}</span><span class="staff-badge {{ s.window_tone }}">{{ s.window_label }}</span></div></article>

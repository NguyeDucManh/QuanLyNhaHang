<div class="assistant-shell" data-assistant data-history-url="{% url 'ai_chat_history' %}">
<header class="assistant-header"><span class="assistant-avatar" aria-hidden="true">✦</span><div><strong>Trợ lý AI nhà hàng</strong><small>Hỏi về món ăn, đặt bàn, đơn hàng và thanh toán.</small></div>{% if mini %}<button type="button" id="help-close" class="icon-button" aria-label="Đóng trợ lý">×</button>{% endif %}</header>
<div class="assistant-messages" role="log" aria-live="polite"><article class="chat-message assistant"><span class="message-avatar" aria-hidden="true">✦</span><div class="message-bubble">Bạn muốn tìm món, đặt bàn hay kiểm tra đơn hàng?<time>Bây giờ</time></div></article></div>
<div class="assistant-chips">{% for chip in assistant_chips %}<button type="button" data-question="{{ chip }}">{{ chip }}</button>{% empty %}<button type="button" data-question="Món dưới 500k">Món dưới 500k</button><button type="button" data-question="Combo 2 người">Combo 2 người</button><button type="button" data-question="Tôi muốn đặt bàn">Đặt bàn</button><button type="button" data-question="Ưu đãi hôm nay">Ưu đãi hôm nay</button><button type="button" data-question="Đơn hàng của tôi">Đơn của tôi</button>{% endfor %}</div>
<form class="assistant-input" data-ai-chat action="{% url 'ai_chat_message' %}">{% csrf_token %}<label class="sr-only">Tin nhắn cho trợ lý AI<textarea name="message" rows="1" maxlength="2000" placeholder="Bạn muốn hỏi điều gì?" required></textarea></label><button type="submit" aria-label="Gửi tin nhắn">↑</button></form>
<footer class="assistant-footer"><small>AI trả lời từ dữ liệu nhà hàng.</small><a href="{% url 'chat' %}">👤 Nhắn nhân viên</a></footer>
</div>

{% extends management_base %}{% block admin_title %}{{ title }}{% endblock %}
{% block admin_content %}<div class="module-heading"><h1>{{ title }}{% if object %}: {{ object }}{% endif %}</h1><a class="view-button" href="{% url back_url_name %}">Về danh sách</a></div><section class="panel resource-form"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="resource-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="primary-button">Lưu thay đổi</button></form></section>{% endblock %}

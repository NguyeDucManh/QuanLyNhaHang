<article class="home-dish"><a class="home-dish-image" href="{% url 'customer_food_detail' dish.id %}"><img src="{{ dish.image }}" alt="{{ dish.name }}"><span aria-hidden="true">♡</span></a><div><h3><a href="{% url 'customer_food_detail' dish.id %}">{{ dish.name }}</a></h3><strong>{{ dish.price_display }}</strong><form class="add-form" action="{% url 'update_cart' dish.id %}" method="post">{% csrf_token %}<button type="submit" aria-label="Thêm {{ dish.name }} vào giỏ">+</button></form></div></article>

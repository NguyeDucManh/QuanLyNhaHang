{% load ui_vi %}{% load money %}{% if combo_rows %}<section class="container section"><h2>Combo trong giỏ</h2>{% for row in combo_rows %}<article class="form-card"><h3>{{ row.combo.name }} × {{ row.quantity }} · {{ row.total|money }}</h3><form method="post" action="{% url 'combo_cart' row.combo.pk %}">{% csrf_token %}<button name="action" value="remove">Bỏ combo</button></form></article>{% endfor %}<a class="button" href="{% url 'customer_booking' %}">Đặt bàn với combo</a></section>{% endif %}{% for error in cart_errors %}<p class="message error">{{ error }}</p>{% endfor %}

<form class="menu-filters" method="get">{% if booking_menu %}<input type="hidden" name="from" value="booking">{% endif %}<div class="input-search"><svg class="icon"><use href="#i-search"/></svg><input name="q" value="{{ query }}" placeholder="Tìm tên món ăn…" aria-label="Tên món ăn"></div><select name="category" aria-label="Danh mục món">{% for key,label in categories %}<option value="{{ key }}" {% if category == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><input name="min_price" type="number" min="0" placeholder="Giá từ (đ)" aria-label="Giá tối thiểu" value="{{ request.GET.min_price }}"><input name="max_price" type="number" min="0" placeholder="Đến (đ)" aria-label="Giá tối đa" value="{{ request.GET.max_price }}"><select name="sort" aria-label="Sắp xếp"><option value="catalog">Thứ tự thực đơn</option><option value="name" {% if request.GET.sort == 'name' %}selected{% endif %}>Tên món</option><option value="price_asc" {% if request.GET.sort == 'price_asc' %}selected{% endif %}>Giá tăng dần</option><option value="price_desc" {% if request.GET.sort == 'price_desc' %}selected{% endif %}>Giá giảm dần</option></select><button class="button">Tìm món</button></form>

name: Ubuntu PostgreSQL regression

on:
  pull_request:
    branches: [main, integration/master-readiness]
  push:
    branches: [main, integration/master-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: restaurant_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_DEBUG: 'true'
      RENDER: 'false'
      DATABASE_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: restaurant_ci
      DB_USER: postgres
      DB_PASSWORD: ci-disposable-only
      DB_TEST_NAME: test_restaurant_ci
      TABLE_SERVICE_ASSIGNMENTS_ENABLED: 'false'
      TABLE_SERVICE_LIFECYCLE_ENABLED: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      STRIPE_SECRET_KEY: sk_test_ci_fixture
      STRIPE_WEBHOOK_SECRET: whsec_ci_fixture
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux shared libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2 libglib2.0-0 libportaudio2
      - name: Install exact production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt
          python -m pip check
      - name: Checks and migration graph
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          bash -n build.sh
          python manage.py migrate customers 0021 --noinput
          python manage.py migrate sessions --noinput
          python scripts/ci_readiness.py legacy
          python manage.py migrate --noinput
          python manage.py migrate --check
          python scripts/ci_readiness.py migrated
          # Reversal is allowed ONLY on this empty disposable CI database.
          python manage.py migrate customers 0021 --noinput
          python scripts/ci_readiness.py legacy
          python manage.py migrate --noinput
          python scripts/ci_readiness.py migrated
          python manage.py expire_booking_deposits
      - name: FaceNet assets and actual Linux initialization
        run: |
          python manage.py download_ai_models --face-only
          python scripts/ci_readiness.py face
      - name: Production static build
        env:
          DJANGO_DEBUG: 'false'
        run: bash build.sh
      - name: Full regression (tests include feature flags ON and OFF)
        run: python manage.py test --noinput --parallel 2 --verbosity 2
      - name: Redis cross-client readiness
        env:
          CHANNEL_REDIS_URL: redis://127.0.0.1:6379/15
          TABLE_SERVICE_ASSIGNMENTS_ENABLED: 'true'
          TABLE_SERVICE_LIFECYCLE_ENABLED: 'true'
        run: |
          python scripts/ci_readiness.py redis
          python manage.py check_operational_readiness --require-enabled --require-redis
